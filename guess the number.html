<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎯 Guess the Number Game</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      padding: 40px;
      transition: background 0.5s ease-in-out;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    input, button {
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      margin: 10px;
      outline: none;
      transition: all 0.3s ease;
    }

    input {
      width: 180px;
      text-align: center;
    }

    button {
      background-color: #ff0077;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #ff3399;
      transform: scale(1.05);
    }

    #message {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      animation: fadeIn 0.5s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .play-again {
      margin-top: 15px;
      background-color: #00ff99;
      color: black;
    }

    .play-again:hover {
      background-color: #00cc77;
    }
  </style>
</head>
<body>

  <h1>🎯 Guess the Number Game!</h1>
  <p>I’m thinking of a number between <strong>1 and 100</strong>.</p>

  <input type="number" id="guessInput" placeholder="Enter your guess">
  <button onclick="checkGuess()">Submit</button>

  <p id="message"></p>

  <script>
    let secretNumber = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;

    function checkGuess() {
      const userGuess = parseInt(document.getElementById("guessInput").value);
      const message = document.getElementById("message");
      const body = document.body;
      attempts++;

      if (isNaN(userGuess)) {
        message.textContent = "❌ Please enter a valid number!";
        message.style.color = "#ffcc00";
        body.style.background = "linear-gradient(135deg, #ffcc00, #ff6600)";
      } else if (userGuess < 1 || userGuess > 100) {
        message.textContent = "⚠ Number must be between 1 and 100!";
        message.style.color = "#ff6600";
        body.style.background = "linear-gradient(135deg, #ff6600, #ff3300)";
      } else if (userGuess === secretNumber) {
        message.innerHTML = `🎉 Correct! You guessed it in ${attempts} tries!`;
        message.style.color = "black";
        body.style.background = "linear-gradient(135deg, #00ff99, #00cc66)";
        showPlayAgain();
      } else if (userGuess < secretNumber) {
        message.textContent = "🔼 Too low! Try again.";
        message.style.color = "#00ffff";
        body.style.background = "linear-gradient(135deg, #00ffff, #0077ff)";
      } else {
        message.textContent = "🔽 Too high! Try again.";
        message.style.color = "#ff33cc";
        body.style.background = "linear-gradient(135deg, #ff33cc, #cc00ff)";
      }
    }

    function showPlayAgain() {
      const message = document.getElementById("message");
      const playAgainBtn = document.createElement("button");
      playAgainBtn.textContent = "🔁 Play Again";
      playAgainBtn.classList.add("play-again");
      playAgainBtn.onclick = () => location.reload();
      message.appendChild(document.createElement("br"));
      message.appendChild(playAgainBtn);
    }
  </script>

</body>
</html>
